{% extends 'base.html' %}

{% block content %}
<div class="text-center py-20">
    <h1 class="text-4xl font-bold text-gray-900 mb-4">Welcome to SocialApp</h1>
    <p class="text-lg text-gray-600 mb-8">Connect with friends and share your moments.</p>
    {% if not user.is_authenticated %}
    <div class="space-x-4">
        <a href="{% url 'login' %}"
            class="bg-indigo-600 text-white px-6 py-3 rounded-lg font-medium hover:bg-indigo-700">Login</a>
        <a href="{% url 'signup' %}"
            class="bg-white text-indigo-600 border border-indigo-600 px-6 py-3 rounded-lg font-medium hover:bg-indigo-50">Sign
            Up</a>
    </div>
    {% else %}
    <p class="text-xl text-gray-800">Hello, {{ user.username }}!</p>
    {% endif %}
</div>
{% endblock %}
